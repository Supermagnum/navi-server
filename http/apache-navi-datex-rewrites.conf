# Shared DATEX legacy-path redirects for the packs DocumentRoot.
# Included by :80 (apache-navi-packs.conf) and :443 (navi-packs-common.conf).
#
# Install:
#   sudo cp /media/navi/navi-server/http/apache-navi-datex-rewrites.conf \
#           /etc/apache2/conf-available/apache-navi-datex-rewrites.conf
#
# RewriteEngine is set here so this snippet is valid even if the parent
# vhost/snippet forgot it. Keep /datex/providers.json and
# /datex/<provider_id>/... unrewritten.

RewriteEngine On
RewriteRule ^/datex/(GetSituation|GetTravelTimeData|GetMeasuredWeatherData|GetCCTVSiteTable)\.xml$ /datex/npra/$1.xml [R=301,L]
RewriteRule ^/datex/source\.json$ /datex/npra/source.json [R=301,L]
