# Apache VirtualHost: Navi indexed packs — static GET/HEAD only on port 80.
#
# DocumentRoot is ONLY /media/navi/navi-server/data/published
# Packs live under packs/<geofabrik-path>/<generation>/ (nested paths OK —
# no RewriteRule required). Landing page: index.html (installed from
# http/index.html by setup-server.sh). DirectoryIndex defaults apply;
# Options -Indexes disables listing when index.html is absent.
# Never point this at scripts/, data/scratch, data/staging, data/state,
# or systemd/.
#
# Install (requires sudo) — replaces 000-default as the :80 site:
#   sudo cp /media/navi/navi-server/http/apache-navi-packs.conf \
#           /etc/apache2/sites-available/apache-navi-packs.conf
#   sudo a2dissite 000-default.conf
#   sudo a2ensite apache-navi-packs
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   systemctl --user disable --now navi-packs-static.service   # stop :8097 prototype
#
# Verify:
#   curl -sI http://127.0.0.1/current.json
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST http://127.0.0.1/current.json
#   # expect POST → 403

<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost

    DocumentRoot /media/navi/navi-server/data/published

    RewriteEngine On
    # Belt-and-braces method filter (LimitExcept alone can be bypassed by some modules).
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$ [NC]
    RewriteRule ^ - [R=405,L]

    # No request-driven execution on this vhost.
    <IfModule mod_php.c>
        php_admin_flag engine off
    </IfModule>
    <IfModule mod_php8.c>
        php_admin_flag engine off
    </IfModule>
    <IfModule mod_php8.3.c>
        php_admin_flag engine off
    </IfModule>

    <Directory "/media/navi/navi-server/data/published">
        Options -Indexes -ExecCGI -Includes -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html

        # GET and HEAD only — reject write methods at the server config level.
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>

        RemoveHandler .cgi .pl .py .php .phtml .php3 .php4 .php5 .php7 .php8 .shtml .fcgi
        RemoveType .cgi .pl .py .php .phtml .php3 .php4 .php5 .php7 .php8 .shtml .fcgi
        <FilesMatch "\.(cgi|pl|py|php|phtml|php[0-9]|shtml|fcgi)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # DATEX cache (optional plugin): serve only snapshot XML + source.json written
    # by the poller. No directory listing; reject partials/secrets/scripts.
    <Directory "/media/navi/navi-server/data/published/datex">
        Options -Indexes -ExecCGI -Includes -FollowSymLinks
        AllowOverride None
        Require all granted
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
        <FilesMatch "(?i)\.(partial|env|bak|tmp|sh|py)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <DirectoryMatch "^/media/navi/navi-server/(scripts|systemd|docs|plugins)(/|$)">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "^/media/navi/navi-server/data/(scratch|staging|state|generations|logs|secrets|datex_npra)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/navi-packs-error.log
    CustomLog ${APACHE_LOG_DIR}/navi-packs-access.log combined

    TraceEnable off
</VirtualHost>
