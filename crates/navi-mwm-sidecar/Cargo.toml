[package]
name = "navi-mwm-sidecar"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Navi MWM wetland/boardwalk sidecar (NVSC v1) builder and inspector"
publish = false

[[bin]]
name = "navi-mwm-sidecar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
