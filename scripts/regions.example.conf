# One region per line:  region_id<TAB>source [key=value ...]
#
# TRACKED template. setup-server.sh copies this to data/regions.conf when
# missing. data/regions.conf stays gitignored (local runtime copy, same
# pattern as data/config.env) — keep portable terrain_class / skip_reason /
# band overrides HERE so investigative tags are version-controlled. After
# editing this file on a box that already has data/regions.conf, sync the
# changed lines into the local copy (or re-copy) so the live merge path
# still sees them.
#
# Sources:
#   geofabrik:<path>   → https://download.geofabrik.de/<path>-latest.osm.pbf (+ .md5)
#   url:<https://...>  → direct PBF URL (checksum skipped if no .md5 sibling)
#   planet             → planet-latest.osm.pbf (full weekly planet; huge)
#
# Optional trailing key=value pairs override size-band checks in
# validate-packs.sh for that region only (global NAVI_SIZE_* defaults
# otherwise). Supported keys:
#   graph_min_ratio / graph_max_ratio
#   poi_min_ratio / poi_max_ratio
#   wetland_min_ratio / wetland_max_ratio
#   total_min_ratio / total_max_ratio
#   terrain_class=polar_sparse  — relaxes ONLY graph_min to
#     NAVI_SIZE_GRAPH_MIN_RATIO_POLAR_SPARSE (default 0.001)
#   terrain_class=wetland_heavy — relaxes ONLY wetland_max to
#     NAVI_SIZE_WETLAND_MAX_RATIO_WETLAND_HEAVY (default 1.0)
#   terrain_class=dense_network — relaxes ONLY graph_max to
#     NAVI_SIZE_GRAPH_MAX_RATIO_DENSE_NETWORK (default 25.0)
#   Multiple classes: terrain_class=wetland_heavy,dense_network
#   skip_reason=no_road_network — orchestration skip (planet-leaves): no
#     fetch/convert/validate/publish. For leaves with literally 0 highway=*
#     ways (convert hard-fails empty graph by design). NOT a validate band;
#     distinct from terrain_class (which relaxes bands for real-but-sparse
#     routable data). Keep tags in data/regions.conf at runtime (merged
#     when baking from regions.planet.conf); do not hand-edit planet conf.
# Prefer terrain_class over one-off numeric overrides for known geography
# classes. Unlisted regions are unchanged. Do not widen global bands just
# because one region is a genuine outlier.
#
# Prototype / smoke test: Hedmark (~90 MiB) from OSM.fr — matches the
# measured convert anchor in docs/indexed-map-format-plan.md.
# Geofabrik no longer publishes fylke-level Norway extracts; OSM.fr does.

# --- terrain_class=wetland_heavy ---
# Shared wetland_max ceiling 1.0 (global stays 0.5). Measured anchors:
#   hedmark 0.786 (inland mire / Ramsar Hedmarksvidda)
#   africa_guinea_bissau 0.643 (mangrove / Bijagós / estuaries)
#   north_america_us_florida 0.576 (Everglades / coastal marsh / mangrove)
# Spread ~0.21 under a single 1.0 ceiling (same value previously used as
# numeric wetland_max_ratio for Hedmark and GW) — migrate to the shared tag.
# Counterexample: brazil_norte wetland 0.054 — Amazon rainforest is mostly
# natural=wood/forest in OSM, not natural=wetland; "wet climate" alone does
# not imply this class.

# Inland mire-heavy county (~10% area as mires). Vestlandet coastal measured
# ~0.214 and stays on the global 0.5 band.
hedmark	url:https://download.openstreetmap.fr/extracts/europe/norway/hedmark-latest.osm.pbf	terrain_class=wetland_heavy

# Mangrove / coastal-wetland dense. Peer WA-coast ratios under global 0.5:
# Senegal 0.121, Sierra Leone 0.062, Guinea 0.025, Liberia 0.018.
africa_guinea_bissau	geofabrik:africa/guinea-bissau	terrain_class=wetland_heavy

# Everglades + Gulf/Atlantic coastal marsh/mangrove. Live pause 2026-09-05
# (wetland 0.576). Convert-clean; graph/poi/total in band.
north_america_us_florida	geofabrik:north-america/us/florida	terrain_class=wetland_heavy

# Mississippi River delta + extensive coastal marsh — same Gulf wetland
# mechanism as Florida; pre-tag before batch 3 reaches it.
north_america_us_louisiana	geofabrik:north-america/us/louisiana	terrain_class=wetland_heavy

# Ganges–Brahmaputra delta / Sundarbans mangrove — classic delta wetland
# density vs PBF (not "Amazon-adjacent forest").
asia_bangladesh	geofabrik:asia/bangladesh	terrain_class=wetland_heavy

# Mekong delta — same major-delta OSM wetland density pattern.
# Also dense_network (see below): measured graph ratio 23.134 — multi-class.
asia_vietnam	geofabrik:asia/vietnam	terrain_class=wetland_heavy,dense_network

# Niger delta mangrove/estuary — same coastal-wetland class as Guinea-Bissau.
africa_nigeria	geofabrik:africa/nigeria	terrain_class=wetland_heavy

# Nord-Norge: pause 2026-09-07 — wetland ratio 0.585 (pack 226.3 /
# PBF 386.9) vs global 0.5. Same inland-mire / arctic-wetland OSM density
# pattern as Hedmark (0.786); graph 1.263 / poi 0.176 / total 2.024 OK.
europe_norway_nord_norge	geofabrik:europe/norway/nord-norge	terrain_class=wetland_heavy

# --- terrain_class=dense_network ---
# Shared graph_max ceiling 25.0 (global stays 20.0). Mechanism: fine-grained
# local-road OSM tagging (residential/service/living_street) → high graph
# pack/PBF without duplication.
# Generalized after multiple measured ceiling approaches/breaches (2026-09-06+):
#   Vietnam 23.134 (first breach; was narrow graph_max=25, migrated here)
#   Thailand 20.314 (second breach — pause that justified the class)
#   northern India 23.874, Pakistan 23.305, Iran 20.778, Azerbaijan 20.464
#   Shandong 19.782, Henan 18.067, Hebei 17.134, Tianjin 16.995,
#   Mexico 16.320, Malaysia/SG/BN 15.195, Fujian 15.054, Cambodia 15.091
# Name is NOT Asia-locked (Mexico/Egypt evidence). Counterexamples left
# untagged: Philippines 5.53, Java 7.60, Laos 9.89, Guangdong 10.49,
# Kazakhstan 7.53, Nigeria (low hwy/MiB) — dense country ≠ this pack/PBF
# pattern. Ceiling 25 still flags runaway duplication.
# Multi-class with wetland_heavy where both apply (Vietnam).
#
# Proxy formula (2026-09-07, post-Azerbaijan): local_road% =
#   (residential + service + living_street) / highway_ways.
# PRETAG if hwy/MiB>=7800 and local_road%>=55; WATCH if hwy/MiB>=7000
# and local_road%>=50. Pass-1 used res+svc only (missed Azerbaijan's
# 47% living_street). Orig-29 re-score flips: Azerbaijan SKIP→PRETAG
# (tagged); Iraq SKIP→WATCH (live measured 19.293 — under ceiling, no
# tag). Targeted +7 oil/Caspian-adjacent priors (Libya, Angola, Gabon,
# Eq. Guinea, Congo-Brazzaville, Cameroon, Namibia) all SKIP — no
# Azerbaijan clones found. living_street was the composition gap;
# track/path/unclassified were not. Full remaining-leaf rescan deferred;
# residual dense_network pauses remain possible but should resolve quickly.

# Thailand: pause evidence — e/n 2.17, 2.93M hwy (46% residential + 32%
# service; soi/alley conventions), 9392 hwy/MiB, 2268 B/hwy — in line with
# Vietnam/Malaysia, not a 2× dup outlier.
asia_thailand	geofabrik:asia/thailand	terrain_class=dense_network

# Measured ≥15 retroactive tags (already passed under global 20; document
# the cluster and keep future remakes consistent).
asia_china_shandong	geofabrik:asia/china/shandong	terrain_class=dense_network
asia_china_henan	geofabrik:asia/china/henan	terrain_class=dense_network
asia_china_hebei	geofabrik:asia/china/hebei	terrain_class=dense_network
asia_china_tianjin	geofabrik:asia/china/tianjin	terrain_class=dense_network
asia_china_fujian	geofabrik:asia/china/fujian	terrain_class=dense_network
asia_malaysia_singapore_brunei	geofabrik:asia/malaysia-singapore-brunei	terrain_class=dense_network
asia_cambodia	geofabrik:asia/cambodia	terrain_class=dense_network
north_america_mexico	geofabrik:north-america/mexico	terrain_class=dense_network

# Myanmar: pre-tag — same SE Asia fine-grained urban road pattern as
# Thailand/Cambodia/Vietnam; still in remaining batch 6. Not Philippines/
# Indonesia (measured low ratios).
asia_myanmar	geofabrik:asia/myanmar	terrain_class=dense_network

# Northern India zone: pause 2026-09-06 — graph ratio 23.874 (under class
# 25.0). Light sanity: e/n 2.54, 8905 hwy/MiB, 60% residential — same
# shape as Vietnam/Thailand, not a 2× dup. Do NOT pre-tag other Indian
# zones from this leaf (eastern/southern already passed global 20 clean;
# evaluate western/etc when reached).
asia_india_northern_zone	geofabrik:asia/india/northern-zone	terrain_class=dense_network

# Pakistan: pause 2026-09-07 — graph ratio 23.305. Light sanity: e/n 2.35,
# 8490 hwy/MiB, 58% residential — same dense_network shape.
asia_pakistan	geofabrik:asia/pakistan	terrain_class=dense_network

# Iran: pause 2026-09-07 — measured graph ratio 20.778 (pack 4541.9 /
# PBF 218.6). Offline PBF probe + convert metrics: e/n 2.16
# (738415/341305), 9758 hwy/MiB, 66.7% residential+service (55.6%+11.2%)
# — same dense_network shape as Vietnam/Thailand/Pakistan. Pre-tag from
# proactive remaining-leaf scan (2026-09-07); do NOT blanket-tag GCC
# from this leaf (GCC probe = WATCH only: 7673 hwy/MiB).
asia_iran	geofabrik:asia/iran	terrain_class=dense_network

# Egypt: proactive pre-tag (2026-09-07 offline PBF probe, not yet reached
# by bake). 10900 hwy/MiB, 73.2% residential+service (65.2%+8.0%) —
# clear numeric match to confirmed dense_network band (hwy/MiB
# 8k–10k+, high res+svc). e/n and pack ratio not yet measured (no
# convert); estimated graph ratio soft-proxy >>20. Conservative: tag
# only because PBF proxies are as strong as Vietnam/northern India.
africa_egypt	geofabrik:africa/egypt	terrain_class=dense_network

# Azerbaijan: pause 2026-09-07 — graph ratio 20.464. Not a new mechanism:
# 47.4% living_street + 17.2% service + 8.4% residential = 72.9% local-road
# (res+svc alone looked like "wrong composition" at 25.5% in the proactive
# scan SKIP). e/n 2.37, 7825 hwy/MiB, 2741 B/hwy — same dense_network
# shape; living_street is the residential-equivalent tagging convention
# here. Oil/pipeline ways are negligible and not in the graph spill.
asia_azerbaijan	geofabrik:asia/azerbaijan	terrain_class=dense_network

# --- terrain_class=polar_sparse ---
# Shared mechanism: global graph_min=0.1 stays for untagged regions; tagged
# regions use floor 0.001. Measured anchors: antarctica ~0.059, Nunavut
# Qikiqtaaluk ~0.009. Cold alone is not enough (Greenland/Iceland/Falklands
# passed the global 0.1 band).
#
# Naming note: the tag is slightly imprecise. It now covers genuinely
# different climates (Arctic archipelago, Antarctic, tropical/subtropical
# reef — Coral Sea) purely because the mechanism is identical: huge
# Geofabrik bbox dominated by empty ocean/ice/reef, tiny real road network
# in one corner. A misleading name is cheap; proliferating near-identical
# tags is expensive. Do NOT invent maritime_sparse / desert_sparse / etc.
# from one leaf. If a fourth or fifth measured case appears in yet another
# climate, consider a rename pass (e.g. terrain_class=bbox_sparse) rather
# than stacking synonyms.

antarctica	geofabrik:antarctica	terrain_class=polar_sparse
north_america_canada_nunavut_qikiqtaaluk	geofabrik:north-america/canada/nunavut/qikiqtaaluk	terrain_class=polar_sparse

# Kitikmeot: same narrow poi_min_ratio=0.001 as Kivalliq (NOT folded into
# polar_sparse). Evidence (2026-09-05 pause): convert pois=7 — real settlement
# amenities (Aurora Restaurant, Saxifrage, Kuugaq Cafe, KFC, Karak Lake
# Researcher Camp, camp site, toilets). poi ratio 0.004 failed vs global 0.01
# because validate uses poi-barrier PACK size / PBF (small pack vs large polar
# PBF), not missing POI data. Second Nunavut territory with this pattern;
# still hold off generalizing into polar_sparse after only two measured cases.
north_america_canada_nunavut_kitikmeot	geofabrik:north-america/canada/nunavut/kitikmeot	terrain_class=polar_sparse	poi_min_ratio=0.001

# Kivalliq: polar_sparse covers graph_min (0.006 OK). poi_min_ratio=0.001 is a
# NARROW single-region override — NOT folded into polar_sparse yet.
# Evidence (2026-09-05 pause): convert pois=42 vs Qikiqtaaluk pois=43 (same
# ballpark); pack contents are real hamlet amenities (Inns North, Tim Hortons,
# Heritage Centre, etc.). poi *ratio* 0.002 failed because the validate metric
# is poi-barrier PACK size / PBF, and Kivalliq has far fewer barrier_segs
# (28k) than Qikiqtaaluk (721k), which cleared at 0.058 without needing a
# poi floor change. Do not generalize until more polar leaves show the same
# pack-size pattern under the global 0.01 floor.
north_america_canada_nunavut_kivalliq	geofabrik:north-america/canada/nunavut/kivalliq	terrain_class=polar_sparse	poi_min_ratio=0.001

# Svalbard + Jan Mayen: polar archipelago, settlement/research roads only.
# ~2.9k residents (SSB 2026) — denser tourism mapping than Nunavut hamlets;
# leave poi_min on the global band until measured (do not pre-relax).
europe_norway_svalbard_janmayen	geofabrik:europe/norway/svalbard-janmayen	terrain_class=polar_sparse

# Northwest Territories: extend polar_sparse (same bbox/PBF-bulk mechanism as
# Nunavut, less extreme). Evidence (2026-09-06 pause): PBF 405.8 MiB,
# graph pack 21.3 MiB → ratio 0.052 vs global floor 0.1; convert
# nodes=8325 edges=20437 pois=282 barrier_segs=284096 wetland_rings=86171;
# highway ways ~150k including trunk/primary (Dempster/Mackenzie/Yellowknife
# corridors are real). Bbox (−138.85,58.06)…(−89,85) is a huge Arctic
# rectangle; PBF dominated by lakes/wetland/coast, roads concentrated in the
# southern/settled belt. Earlier "NWT has real highways → skip polar_sparse"
# was true about road *existence* but asserted without measuring the
# pack/PBF ratio — corrected here. poi/wetland cleared global bands (0.023 /
# 0.195); no narrow numeric override. Yukon NOT pre-tagged: Geofabrik PBF
# ~70.7 MiB with ~4.4k hwy/MiB vs NWT ~369 hwy/MiB — expected graph ratio
# well above 0.1; leave until measured.
north_america_canada_northwest_territories	geofabrik:north-america/canada/northwest-territories	terrain_class=polar_sparse

# Svalbard stays polar_sparse above; Heard/McDonald moved to skip_reason
# (0 highway ways — convert would hard-fail; terrain_class cannot help).

# Coral Sea Islands Territory: NOT polar climate — tropical/subtropical
# reef/islet extract — but SAME bbox/PBF-bulk mechanism as polar_sparse
# (Geofabrik header bbox ~146.9…160.4 E, −30.6…−15.0 S spanning empty
# ocean; PBF ~0.173 MiB dominated by natural=reef/coastline, not roads).
# Evidence (2026-09-06 pause): convert nodes=4 edges=4 pois=0
# barrier_segs=0 wetland_rings=0; graph ratio 0.012 / poi 0.002 / total
# 0.014 vs global floors 0.1 / 0.01 / 0.05 (wetland 0.000 OK under min
# 0.0). Highway probe: 2 ways only (highway=track + highway=path
# informal=yes), both on Willis Island (~−16.288, 149.964) next to BoM
# weather radar / monitoring_station — earlier "13 ways" was an opl
# line-count that included 11 referenced nodes. polar_sparse covers
# graph_min (0.012 > 0.001). poi_min_ratio=0.001 + total_min_ratio=0.01
# are NARROW single-region overrides (first total_min use) — NOT folded
# into polar_sparse; do not invent a maritime_sparse class from one leaf.
australia_oceania_australia_coral_sea_islands	geofabrik:australia-oceania/australia/coral-sea-islands	terrain_class=polar_sparse	poi_min_ratio=0.001	total_min_ratio=0.01

