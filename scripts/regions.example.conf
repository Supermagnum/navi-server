# One region per line:  region_id<TAB>source [key=value ...]
#
# Sources:
#   geofabrik:<path>   → https://download.geofabrik.de/<path>-latest.osm.pbf (+ .md5)
#   url:<https://...>  → direct PBF URL (checksum skipped if no .md5 sibling)
#   planet             → planet-latest.osm.pbf (full weekly planet; huge)
#
# Optional trailing key=value pairs override size-band checks in
# validate-packs.sh for that region only (global NAVI_SIZE_* defaults
# otherwise). Supported keys:
#   graph_min_ratio / graph_max_ratio
#   poi_min_ratio / poi_max_ratio
#   wetland_min_ratio / wetland_max_ratio
#   total_min_ratio / total_max_ratio
#   terrain_class=polar_sparse  — relaxes ONLY graph_min to
#     NAVI_SIZE_GRAPH_MIN_RATIO_POLAR_SPARSE (default 0.001)
#   terrain_class=wetland_heavy — relaxes ONLY wetland_max to
#     NAVI_SIZE_WETLAND_MAX_RATIO_WETLAND_HEAVY (default 1.0)
# Prefer terrain_class over one-off numeric overrides for known geography
# classes. When baking from regions.planet.conf, keep tags in
# data/regions.conf so validate-packs.sh merges them by region_id.
#
# Prototype / smoke test: Hedmark (~90 MiB) from OSM.fr.

# wetland_heavy: mire / mangrove / coastal-marsh / major-delta. Measured
# anchors hedmark 0.786, guinea_bissau 0.643, florida 0.576. Shared ceiling
# 1.0. brazil_norte 0.054 stays untagged (Amazon forest ≠ OSM wetland).
hedmark	url:https://download.openstreetmap.fr/extracts/europe/norway/hedmark-latest.osm.pbf	terrain_class=wetland_heavy
africa_guinea_bissau	geofabrik:africa/guinea-bissau	terrain_class=wetland_heavy
north_america_us_florida	geofabrik:north-america/us/florida	terrain_class=wetland_heavy
north_america_us_louisiana	geofabrik:north-america/us/louisiana	terrain_class=wetland_heavy
asia_bangladesh	geofabrik:asia/bangladesh	terrain_class=wetland_heavy
asia_vietnam	geofabrik:asia/vietnam	terrain_class=wetland_heavy
africa_nigeria	geofabrik:africa/nigeria	terrain_class=wetland_heavy

# polar_sparse: antarctica ~0.059, nunavut_qikiqtaaluk ~0.009.
antarctica	geofabrik:antarctica	terrain_class=polar_sparse
north_america_canada_nunavut_qikiqtaaluk	geofabrik:north-america/canada/nunavut/qikiqtaaluk	terrain_class=polar_sparse
north_america_canada_nunavut_kitikmeot	geofabrik:north-america/canada/nunavut/kitikmeot	terrain_class=polar_sparse
# poi_min_ratio=0.001: narrow override — Kivalliq poi-barrier pack/PBF 0.002
# with pois=42 (real hamlet amenities); Qikiqtaaluk had pois=43 but ratio
# 0.058 due to barrier_segs. Not yet part of polar_sparse.
north_america_canada_nunavut_kivalliq	geofabrik:north-america/canada/nunavut/kivalliq	terrain_class=polar_sparse	poi_min_ratio=0.001
europe_norway_svalbard_janmayen	geofabrik:europe/norway/svalbard-janmayen	terrain_class=polar_sparse
# Uninhabited — pre-relax poi_min (same risk class as Kivalliq pack-size).
australia_oceania_australia_heard_mcdonald	geofabrik:australia-oceania/australia/heard-mcdonald	terrain_class=polar_sparse	poi_min_ratio=0.001

# Geofabrik US state (~94 MiB) — checksum-verified smoke / weekly candidate:
us_west_virginia	geofabrik:north-america/us/west-virginia

