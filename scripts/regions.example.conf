# One region per line:  region_id<TAB>source [key=value ...]
#
# Sources:
#   geofabrik:<path>   → https://download.geofabrik.de/<path>-latest.osm.pbf (+ .md5)
#   url:<https://...>  → direct PBF URL (checksum skipped if no .md5 sibling)
#   planet             → planet-latest.osm.pbf (full weekly planet; huge)
#
# Optional trailing key=value pairs override size-band checks in
# validate-packs.sh for that region only (global NAVI_SIZE_* defaults
# otherwise). Supported keys:
#   graph_min_ratio / graph_max_ratio
#   poi_min_ratio / poi_max_ratio
#   wetland_min_ratio / wetland_max_ratio
#   total_min_ratio / total_max_ratio
# Unlisted regions are unchanged. Do not widen global bands just because
# one region is a genuine outlier — prefer an explicit override here.
#
# Prototype / smoke test: Hedmark (~90 MiB) from OSM.fr — matches the
# measured convert anchor in docs/indexed-map-format-plan.md.
# Geofabrik no longer publishes fylke-level Norway extracts; OSM.fr does.
#
# wetland_max_ratio=1.0: Hedmark is mire-heavy inland terrain (~10% county
# area as mires / myrer per Skog og landskap; Ramsar Hedmarksvidda Wetland
# System). Measured wetland pack/PBF ratio ~0.786 under the global 0.5
# band; 1.0 leaves headroom without widening the global default (Vestlandet
# coastal fjord/mountain landsdel measured ~0.214 and stays on the global
# band — override is inland/mire-targeted, not "all of Norway").

hedmark	url:https://download.openstreetmap.fr/extracts/europe/norway/hedmark-latest.osm.pbf	wetland_max_ratio=1.0

# wetland_max_ratio=1.0: Guinea-Bissau is mangrove / coastal-wetland dense
# (Bijagós archipelago and mainland estuaries). Measured wetland pack/PBF
# ratio ~0.643 under the global 0.5 band during planet-leaf batch 1; same
# override style as Hedmark (do not widen the global wetland max).
# Peer ratios from the same batch/pipeline isolate geography (not a WA-coast
# bug): Senegal 0.121, Sierra Leone 0.062, Guinea 0.025, Liberia 0.018 —
# and GW had more wetland rings (4877) in a 10.6 MiB PBF than Guinea (2675)
# in 112.7 MiB. When using regions.planet.conf, keep this line in
# data/regions.conf so validate-packs.sh still merges the override.
africa_guinea_bissau	geofabrik:africa/guinea-bissau	wetland_max_ratio=1.0

# Geofabrik US state (~94 MiB) — checksum-verified smoke / weekly candidate:
us_west_virginia	geofabrik:north-america/us/west-virginia

