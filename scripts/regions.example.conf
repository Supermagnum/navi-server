# One region per line:  region_id<TAB>source
#
# Sources:
#   geofabrik:<path>   → https://download.geofabrik.de/<path>-latest.osm.pbf (+ .md5)
#   url:<https://...>  → direct PBF URL (checksum skipped if no .md5 sibling)
#   planet             → planet-latest.osm.pbf (full weekly planet; huge)
#
# Prototype / smoke test: Hedmark (~90 MiB) from OSM.fr — matches the
# measured convert anchor in docs/indexed-map-format-plan.md.
# Geofabrik no longer publishes fylke-level Norway extracts; OSM.fr does.

hedmark	url:https://download.openstreetmap.fr/extracts/europe/norway/hedmark-latest.osm.pbf

# Geofabrik US state (~94 MiB) — checksum-verified smoke / weekly candidate:
us_west_virginia	geofabrik:north-america/us/west-virginia

