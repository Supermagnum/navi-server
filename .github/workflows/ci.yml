# CI for the in-repo pack convert workspace (no Navi app tree required).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: navi-server-rust
          cache-targets: true

      - name: Install osmium-tool (place-source points PBF)
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Format (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests (includes checked-in mini PBF fixtures)
        # Does not run #[ignore] integration tests that need large extracts
        # under target/integration-fixtures (e.g. ostlandet).
        run: cargo test --workspace

      - name: Place-source shell tests (switch off + manifest staging)
        run: |
          cargo build -p place-source-points
          ./scripts/test-place-source.sh

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd (repeaterbook publish)
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: DATEX + RepeaterBook unit tests
        run: |
          python3 -m unittest \
            plugins.datex_common.tests.test_datex_common \
            plugins.datex_common.tests.test_apache_rewrite_snippet \
            plugins.datex_npra.tests.test_datex_npra \
            plugins.repeaterbook.tests.test_repeaterbook \
            -v

      - name: RepeaterBook fixture dry-run
        run: ./scripts/test-repeaterbook-mirror.sh
